name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    # ubuntu-24.04 images ship with the Android SDK preinstalled ($ANDROID_HOME)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: log-${{ github.run_number }}
          name: Build log ${{ github.run_number }}
          prerelease: true
          files: build.log
      - run: cp app/build/outputs/apk/debug/app-debug.apk CalcVault.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CalcVault-apk
          path: CalcVault.apk
      # Publishes the APK on the repo's Releases page so it can be downloaded from a phone browser
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CalcVault build ${{ github.run_number }}
          files: CalcVault.apk
