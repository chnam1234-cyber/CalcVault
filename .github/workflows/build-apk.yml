name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk CalcVault.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CalcVault-apk
          path: CalcVault.apk
      # Publishes the APK on the repo's Releases page so it can be downloaded from a phone browser
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CalcVault build ${{ github.run_number }}
          files: CalcVault.apk
